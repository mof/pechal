# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: home-850115-473610.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: fern-starter
        repo: home-850115-594308
        branch: main
      launch: dashboard
title: home-850115 | Documentation
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header

tabs:
  documentation:
    display-name: Docs
    icon: home
  api-reference:
    display-name: API Reference
    icon: fa-regular fa-code

navigation:
  - tab: documentation
    layout:
      - section: Get started
        contents:
          - page: Introduction
            path: docs/pages/about-us.mdx
            icon: fa-duotone fa-house
      - section: Changelog
        contents:
          - changelog: docs/changelog

  - tab: api-reference
    layout:
      - section: Overview
        contents:
          - page: API reference
            path: docs/pages/introduction.mdx
            icon: fa-duotone fa-book
      - api: Datadog API
        collapsed: true
        api-name: datadog-small-5
colors:
  accent-primary:
    light: "#008700"
    dark: "#4ADE80"
  background:
    light: "#FFFFFF"
    dark: "#111113"
  border:
    light: "#E5E7EB"
    dark: "#222325"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo-datadog-3.png
  light: docs/assets/logo-datadog-3.png
  height: 60
  href: https://buildwithfern.com
favicon: docs/assets/logo-datadog.png
css:
  - styles.css
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
